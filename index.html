<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aveti Learning Tuition Center — Chapter Test Reports</title>
<link rel="icon" href="assets/images/aveti-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Supabase client (used only when USE_SUPABASE = true below) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/css/styles.css?v=20260803-1">
</head>
<body>

<script src="assets/js/config.js?v=20260802-2"></script>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar" aria-label="Primary navigation">
    <div class="sidebar-brand"><span class="sidebar-amark" role="img" aria-label="Aveti Learning Tuition Center"><img alt="" src="assets/images/aveti-logo.png"></span><img class="brandlogo" alt="Aveti Learning Tuition Center" src="assets/images/aveti-logo.png"><button class="sidebar-collapse" type="button" onclick="toggleSidebar()" aria-label="Collapse navigation">‹</button></div>
    <div class="sidebar-label">Workspace</div>
    <nav class="sidebar-nav">
      <button data-route="home" class="nav-item active" onclick="appNavigate('home')"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button data-route="marks" class="nav-item" onclick="appNavigate('marks')"><span class="nav-icon">＋</span><span>Enter marks</span></button>
      <button data-route="students" class="nav-item" onclick="appNavigate('students')"><span class="nav-icon">◎</span><span>Students</span></button>
      <button data-route="centre-admin" data-master-only class="nav-item" onclick="centreAdmin()"><span class="nav-icon">▦</span><span>Centres</span></button>
    </nav>
    <div class="sidebar-label">Reports & tools</div>
    <nav class="sidebar-nav">
      <button data-route="teacher" class="nav-item" onclick="appNavigate('teacher')"><span class="nav-icon">▤</span><span>Teacher report</span></button>
      <button data-route="parent" class="nav-item" onclick="appNavigate('parent')"><span class="nav-icon">◌</span><span>Parent report</span></button>
      <button data-route="growth" class="nav-item" onclick="appNavigate('growth')"><span class="nav-icon">⌁</span><span>Growth tracker</span></button>
      <button data-route="insights" class="nav-item" onclick="appNavigate('insights')"><span class="nav-icon">◫</span><span>Class insights</span></button>
      <button data-route="certificates" class="nav-item" onclick="appNavigate('certificates')"><span class="nav-icon">◇</span><span>Certificates</span></button>
      <button data-route="activation" class="nav-item" onclick="appNavigate('activation')"><span class="nav-icon">↗</span><span>Teacher Activation</span></button>
    </nav>
    <button class="sidebar-signout" data-signout type="button" style="display:none">Sign out</button>
  </aside>
  <main class="app-main">
    <header class="topnav">
      <div class="topnav-inner">
        <button class="mobile-menu" type="button" onclick="toggleMoreMenu()" aria-label="Open navigation">☰</button>
        <div><div class="topbar-kicker">Aveti Learning Tuition Center</div><div class="crumb" id="crumb">Home</div></div>
        <div class="topnav-actions"><div id="centreSwitcher"></div><button class="ghost top-home" id="navHome">Home</button><button class="ghost top-students" id="navRoster">Students</button><button class="primary top-enter" onclick="enterMarks()">Enter marks</button><button class="ghost" id="navSignout" data-signout style="display:none">Sign out</button></div>
      </div>
    </header>
    <div class="app-content" id="app"></div>
  </main>
</div>
<nav class="mobile-bottom-nav" aria-label="Mobile navigation">
  <button data-route="home" class="active" onclick="appNavigate('home')"><span>⌂</span>Home</button>
  <button data-route="marks" onclick="appNavigate('marks')"><span>＋</span>Marks</button>
  <button data-route="students" onclick="appNavigate('students')"><span>◎</span>Students</button>
  <button onclick="toggleMoreMenu()"><span>•••</span>More</button>
</nav>
<div class="more-menu" id="moreMenu" aria-hidden="true"><div class="more-menu-sheet"><div class="more-menu-handle"></div><div class="more-menu-title">More tools</div><button onclick="appNavigate('teacher');toggleMoreMenu()">Teacher report</button><button onclick="appNavigate('parent');toggleMoreMenu()">Parent report</button><button onclick="appNavigate('growth');toggleMoreMenu()">Growth tracker</button><button onclick="appNavigate('insights');toggleMoreMenu()">Class insights</button><button onclick="appNavigate('certificates');toggleMoreMenu()">Certificates</button><button onclick="appNavigate('activation');toggleMoreMenu()">Teacher Activation</button><button data-master-only onclick="appNavigate('centre-admin');toggleMoreMenu()">Centres</button><button class="more-signout" data-signout type="button" style="display:none">Sign out</button></div></div>

<!-- Save confirmation modal -->
<div class="overlay" id="saveOverlay">
  <div class="modal">
    <div class="check">✓</div>
    <h2 style="font-size:19px;">Test saved</h2>
    <div class="muted small" id="saveSummary" style="margin:6px 0 14px"></div>
    <div class="row" style="gap:8px;margin-bottom:8px">
      <button class="primary" style="flex:1" id="saveToParents">Share parent cards</button>
    </div>
    <div class="row" style="gap:8px">
      <button style="flex:1" id="saveToTeacher">Teacher report</button>
      <button style="flex:1" id="saveToGrowth">Growth</button>
    </div>
    <div style="margin-top:12px"><a class="link small" id="saveDone" href="#">Done — back to home</a></div>
  </div>
</div>

<!-- Login (shown only in live Supabase mode) -->
<div class="overlay" id="loginOverlay">
  <div class="modal" style="text-align:left">
    <div class="brandbar" style="justify-content:center;margin-bottom:8px"><img class="brandlogo" style="height:24px" alt="Aveti Learning Tuition Center" src="assets/images/aveti-logo.png"></div>
    <h2 id="loginTitle" style="font-size:19px;text-align:center">Sign in</h2>
    <div class="muted small" style="text-align:center;margin-bottom:14px">Aveti Learning Tuition Center · teacher access</div>
    <label class="tiny muted">Email</label>
    <input id="authEmail" type="email" autocomplete="email" placeholder="you@centre.org" style="margin:4px 0 10px">
    <label class="tiny muted">Password</label>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••" style="margin:4px 0 6px">
    <div id="authErr" class="tiny" style="color:var(--red);min-height:16px;margin-bottom:8px"></div>
    <button class="primary" id="authSubmit" style="width:100%">Sign in</button>
    <div class="small muted" style="text-align:center;margin-top:12px"><a href="#" class="link" id="authToggle">New centre? Create an account</a></div>
  </div>
</div>
